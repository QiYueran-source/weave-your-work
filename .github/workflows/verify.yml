name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  install:
    name: Install the set as a stranger would
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the skill set
        env:
          HOME: ${{ runner.temp }}/home
        run: |
          mkdir -p "$HOME"
          npx --yes skills@1.7.6 add . -g -y -a codex --json > "$RUNNER_TEMP/skills.json"

      - name: Check what the install produced
        run: node scripts/check-skills.mjs . "$RUNNER_TEMP/skills.json"
