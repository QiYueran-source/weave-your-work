name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install tool dependencies
        run: |
          npm ci --prefix weave-your-work/setup/tools/adr
          npm ci --prefix weave-your-work/setup/tools/glossary
          npm ci --prefix weave-your-work/setup/tools/issue

      - name: Run the tool tests
        run: npm test

      - name: Check the set's structure
        run: node scripts/check-references.mjs .

      - name: Check the records against their assertions
        run: node scripts/check-records.mjs . --baseline scripts/check-records-baseline.json

      - name: Install the skill set
        env:
          HOME: ${{ runner.temp }}/home
        run: |
          mkdir -p "$HOME"
          npx --yes skills@1.7.6 add . -g -y -a codex --json > "$RUNNER_TEMP/skills.json"

      - name: Check what the install produced
        run: node scripts/check-skills.mjs . "$RUNNER_TEMP/skills.json"

      - name: Create version pull request
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npx changeset tag
          commit: "chore: version skills"
          title: "chore: version skills"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
