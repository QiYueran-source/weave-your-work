[project]
name = "work-weaver"
version = "0.1.0"
description = "A prototype for composable edge-agent workflows built from weave-your-work methods."
requires-python = ">=3.11"
dependencies = [
  "fast-agent-mcp>=0.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
