# Map project owners to their GitHub logins.
[handles]
frank = "QiYueran-source"

# [pending].path names the queue file the listener writes: the open communicate
# threads, one JSON object per line. It is local state, not a record, and it
# lives under .work-weave/personal/. A relative path is read from the project
# root. The key is optional; without it the listener uses its default,
# .work-weave/personal/communication/pending.jsonl.
[pending]
path = ".work-weave/personal/communication/pending.jsonl"
